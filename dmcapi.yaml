 # schemas/Observation.yaml
    Observation:
      title: Observation
      description: |
        Laboratory and clinical or diagnostic data for patients and/or specimens derived from these.
        Aligns with FHIR R4 Observation resource for veterinary diagnostics.

        This resource represents measurements and assertions made about a patient, device or other subject.
      type: object
      properties:
        resourceType:
          type: string
          enum: [Observation]
          description: FHIR resource type identifier
          example: Observation
        id:
          type: string
          format: uuid
          description: Unique identifier for the observation
          readOnly: true
        meta:
          type: object
          description: FHIR metadata about the resource
          properties:
            versionId:
              type: string
            lastUpdated:
              type: string
              format: date-time
        status:
          type: string
          description: |
            Status of the observation. Aligned with FHIR ObservationStatus value set.

            - `registered` — The observation has been registered but not yet performed (maps from PENDING)
            - `preliminary` — Initial results available, not yet verified
            - `final` — The observation is complete and verified (maps from DONE)
            - `amended` — Subsequent to being Final, the observation has been modified
            - `corrected` — Subsequent to being Final, the observation has been modified and is complete
            - `cancelled` — The observation is unavailable (maps from CANCELLED)
            - `entered-in-error` — The observation was entered in error
          enum:
          - registered
          - preliminary
          - final
          - amended
          - corrected
          - cancelled
          - entered-in-error
          example: final
        code:
          type: object
          description: |
            Type of observation (code / type). Maps to FHIR CodeableConcept.
            Contains both simple code/name for backward compatibility and full FHIR coding.
          properties:
            coding:
              type: array
              description: Code defined by a terminology system
              items:
                type: object
                properties:
                  system:
                    type: string
                    description: Identity of the terminology system
                    example: http://loinc.org
                  code:
                    type: string
                    description: Symbol in syntax defined by the system
                    example: '718-7'
                  display:
                    type: string
                    description: Representation defined by the system
                    example: Hemoglobin
            text:
              type: string
              description: Plain text representation of the concept
              example: Hemoglobin
        subject:
          type: object
          description: |
            Reference to the patient this observation is about. In FHIR, this is a Reference to Patient resource.
          properties:
            reference:
              type: string
              description: Relative or absolute URL reference
              example: Patient/74c7cac2-0bd5-4e56-b114-f088a502dc6a
            display:
              type: string
              description: Text alternative for the resource
        effectiveDateTime:
          type: string
          format: date-time
          description: Clinically relevant time/time-period for observation
          example: '2020-01-01T00:00:00.000Z'
        issued:
          type: string
          format: date-time
          description: Date/Time this observation was made available
          example: '2020-01-01T00:00:00.000Z'
        valueString:
          type: string
          description: Actual result - text value
          example: Visible
        valueQuantity:
          type: object
          description: |
            Actual result - numerical value with unit. Maps to FHIR Quantity datatype.
          properties:
            value:
              type: number
              description: Numerical value
              example: 10.0
            comparator:
              type: string
              description: How to understand the value (< | <= | >= | >)
              enum: ['<', '<=', '>=', '>']
            unit:
              type: string
              description: Unit representation
              example: g/dL
            system:
              type: string
              description: System that defines coded unit form (should be UCUM)
              example: http://unitsofmeasure.org
            code:
              type: string
              description: Coded form of the unit
              example: g/dL
        interpretation:
          type: array
          description: |
            High, low, normal, etc. Maps to FHIR ObservationInterpretation value set.

            Standard FHIR codes:
            - N — Normal
            - A — Abnormal  
            - H — High
            - HH — Critical high
            - L — Low
            - LL — Critical low
          items:
            type: object
            properties:
              coding:
                type: array
                items:
                  type: object
                  properties:
                    system:
                      type: string
                      example: http://terminology.hl7.org/CodeSystem/v3-ObservationInterpretation
                    code:
                      type: string
                      enum: [N, A, H, HH, L, LL, AA]
                      example: N
                    display:
                      type: string
                      example: Normal
              text:
                type: string
                description: Plain text representation
                example: Normal
        note:
          type: array
          description: Comments about the observation
          items:
            type: object
            properties:
              text:
                type: string
                example: Measurement was performed in a non-sterile environment
        referenceRange:
          type: array
          description: Provides guide for interpretation of results
          items:
            $ref: '#/components/schemas/ReferenceRange'
        component:
          type: array
          description: Component results for multi-value observations
          items:
            type: object
            description: Component observation
      required:
      - resourceType
      - status
      - code

 # schemas/Order.yaml
    Order:
      title: Order (ServiceRequest)
      type: object
      description: |-
        Requisition for a set of tests to be performed on a patient.
        Aligns with FHIR R4 ServiceRequest resource for veterinary diagnostic orders.

        Desired test codes and target devices should be specified in the order, along with the patient, client and veterinarian details.
      properties:
        resourceType:
          type: string
          enum:
          - ServiceRequest
          description: FHIR resource type identifier
          example: ServiceRequest
        id:
          type: string
          format: uuid
          description: The unique identifier of the order.
          readOnly: true
          example: 74c7cac2-0bd5-4e56-b114-f088a502dc6a
        requisitionId:
          type: string
          description: |
            The original requisition identifier provided by the PIMS.

            This could be used by the PIMS to match the order to the original requisition.
          example: ABC-87436384
        accessionId:
          type: string
          description: |
            The accession identifier provided by the provider.

            The identifier assigned to the order by the provider. This could be used by the PIMS to match the order to the original requisition in the provider's system.
          readOnly: true
          example: 8279820
        integrationId:
          type: string
          format: uuid
          description: The unique identifier of the integration.
          example: 175509ad-3b4a-4668-a7b8-3754c5437e03
        manifest:
          description: The provider-generated manifest (usually a PDF) that accompanies specimens to the lab.
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/Attachment'
          example:
            contentType: application/pdf
            uri: http://example.com/path/to/manifest.pdf
        submissionUri:
          type: string
          format: uri
          readOnly: true
          description: |
            The URL of the provider's UI to complete the order submission.

            This usually will be an iFrame containing a form.
        status:
          type: string
          description: |
            The status of the order. See [Order Status](/docs/dmi/orders#order-status) in the API Reference for more information.

            - `ACCEPTED` - The order is accepted and exists in Nominal’s domain.
            - `WAITING_FOR_INPUT` - The provider requires user input before it can be submitted.
            - `SUBMITTED` - The order has been submitted to the provider.
            - `PARTIAL` - Some tests are completed and are available.
            - `COMPLETED` - All tests in the order have been completed and are available.
            - `CANCELLED` - The order is cancelled and won’t be processed by the provider.
            - `ERROR` - The order is in error and has been withdrawn.

          enum:
          - ACCEPTED
          - WAITING_FOR_INPUT
          - SUBMITTED
          - PARTIAL
          - COMPLETED
          - CANCELLED
          - ERROR
          readOnly: true
          example: COMPLETED
        intent:
          type: string
          description: Whether the request is a proposal, plan, or an original order. Required in FHIR.
          enum:
          - proposal
          - plan
          - directive
          - order
          - original-order
          - reflex-order
          - filler-order
          - instance-order
          - option
          default: order
          example: order
        patient:
          description: The subject the tests are ordered for.
          allOf:
          - $ref: '#/components/schemas/Patient'
        client:
          description: The client of the order. Usually the pet owner.
          allOf:
          - $ref: '#/components/schemas/Client'
        veterinarian:
          description: The veterinarian requesting the order.
          allOf:
          - $ref: '#/components/schemas/Veterinarian'
        testCodes:
          type: array
