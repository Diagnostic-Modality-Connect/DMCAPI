 # schemas/Patient.yaml
    Patient:
      title: Patient
      type: object
      description: |-
        The subject of the ordered tests. Aligns with FHIR R4 Patient resource with veterinary extensions.\n\nThis resource represents the animal patient and uses the FHIR patient-animal extension pattern for veterinary-specific data.
      properties:
        resourceType:
          type: string
          enum: [Patient]
          description: FHIR resource type identifier
          example: Patient
        id:
          type: string
          format: uuid
          description: The unique identifier of the patient. Maps to FHIR Patient.id
          readOnly: true
          example: 74c7cac2-0bd5-4e56-b114-f088a502dc6a
        meta:
          type: object
          description: FHIR metadata about the resource
          properties:
            versionId:
              type: string
              description: Version identifier for the resource
            lastUpdated:
              type: string
              format: date-time
              description: When the resource was last updated
              example: '2020-01-01T00:00:00.000Z'
            profile:
              type: array
              description: Profiles this resource claims to conform to
              items:
                type: string
              example: ['http://dmcapi.org/fhir/StructureDefinition/veterinary-patient']
        extension:
          type: array
          description: |
            FHIR extensions including patient-animal extension for veterinary data.
            Uses http://hl7.org/fhir/StructureDefinition/patient-animal
          items:
            type: object
            properties:
              url:
                type: string
              extension:
                type: array
                items:
                  type: object
        identifier:
          type: array
          description: |
            Business or system (not resource) identifiers. Maps to FHIR Identifier datatype.
          items:
            $ref: '#/components/schemas/Identifier'
        name:
          type: string
          description: |
            The name of the patient. For FHIR compatibility, this is simplified from HumanName array.
            In full FHIR, would be an array of HumanName objects.
          example: Laika
        sex:
          type: string
          description: |
            The sex code. See [Sexes](/docs/dmi/reference-data#sexes) in the API Reference.
            For veterinary use: MALE, FEMALE, MALE_INTACT, MALE_NEUTERED, FEMALE_INTACT, FEMALE_SPAYED, UNKNOWN
          example: MALE
        species:
          type: string
          description: |-
            The species code. See [Species](/docs/dmi/reference-data#species) in the API Reference.
            In FHIR, this maps to the patient-animal extension's species field.
            Recommended to use NCBI Taxonomy codes (e.g., 9615 for Canis lupus familiaris).
          example: CANIS_LUPUS_FAMILIARIS
        breed:
          type: string
          description: |
            The breed code. See [Breeds](/docs/dmi/reference-data#breeds) in the API Reference.
            In FHIR, this maps to the patient-animal extension's breed field.
          example: JACK_RUSSEL_TERRIER
        birthDate:
          type: string
          format: date
          description: |
            Birth date in `YYYY-MM-DD` format. Maps to FHIR Patient.birthDate
          example: '2011-05-14'
        weight:
          type: object
          description: |
            Current weight of the patient. In FHIR, this would typically be an Observation resource,
            but included here for convenience in veterinary diagnostics.
          properties:
            value:
              type: number
              minimum: 0
              description: Measured amount
              example: 10.5
            unit:
              type: string
              description: Unit of measurement (UCUM codes recommended)
              example: kg
            system:
              type: string
              description: System that defines the unit code
              example: http://unitsofmeasure.org
            code:
              type: string
              description: Coded form of the unit (UCUM)
              example: kg
      required:
      - resourceType
      - id
      - name

