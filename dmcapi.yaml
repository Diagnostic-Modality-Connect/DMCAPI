 # schemas/Veterinarian.yaml
    Veterinarian:
      title: Veterinarian (Practitioner)
      type: object
      description: |
        The veterinarian requesting the order. Aligns with FHIR R4 Practitioner resource.
      properties:
        resourceType:
          type: string
          enum: [Practitioner]
          description: FHIR resource type identifier
          example: Practitioner
        id:
          type: string
          format: uuid
          description: The unique identifier of the veterinarian. Maps to FHIR Practitioner.id
          readOnly: true
          example: 5cd4983d-be3b-4bfc-a8a2-4371393f26c8
        meta:
          type: object
          description: FHIR metadata about the resource
          properties:
            versionId:
              type: string
            lastUpdated:
              type: string
              format: date-time
        identifier:
          type: array
          description: |
            Business or system (not resource) identifiers. Maps to FHIR Identifier array.
            May include license numbers, NPI, DEA numbers, etc.
          items:
            $ref: '#/components/schemas/Identifier'
        active:
          type: boolean
          description: Whether this practitioner's record is in active use
          example: true
        name:
          type: array
          description: |
            The name(s) associated with the practitioner. Maps to FHIR HumanName array.
          items:
            type: object
            properties:
              use:
                type: string
                description: The use of this name
                enum: [usual, official, temp, nickname, anonymous, old, maiden]
                example: official
              family:
                type: string
                description: Family name (last name)
                example: Doe
              given:
                type: array
                description: Given names (first name, middle names)
                items:
                  type: string
                example: [John, Robert]
              prefix:
                type: array
                description: Parts that come before the name (Dr., etc.)
                items:
                  type: string
                example: [Dr.]
              suffix:
                type: array
                description: Parts that come after the name (Jr., DVM, etc.)
                items:
                  type: string
                example: [DVM]
              text:
                type: string
                description: Text representation of the full name
                example: Dr. John Doe, DVM
        telecom:
          type: array
          description: Contact details for the practitioner
          items:
            type: object
            properties:
              system:
                type: string
                enum: [phone, fax, email, pager, url, sms, other]
              value:
                type: string
              use:
                type: string
                enum: [home, work, temp, old, mobile]
        qualification:
          type: array
          description: Certification, licenses, or training pertaining to the provision of care
          items:
            type: object
            properties:
              identifier:
                type: array
                items:
                  $ref: '#/components/schemas/Identifier'
              code:
                type: object
                description: Coded representation of the qualification
                properties:
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        system:
                          type: string
                        code:
                          type: string
                        display:
                          type: string
                  text:
                    type: string
                    example: Doctor of Veterinary Medicine
              period:
                type: object
                description: Period during which the qualification is valid
                properties:
                  start:
                    type: string
                    format: date-time
                  end:
                    type: string
                    format: date-time
              issuer:
                type: object
                description: Organization that regulates and issues the qualification
                properties:
                  reference:
                    type: string
                  display:
                    type: string
        firstName:
          type: string
          description: The first name of the veterinarian (for backward compatibility). In FHIR, use name array.
          example: John
        lastName:
          type: string
          description: The last name of the veterinarian (for backward compatibility). In FHIR, use name array.
          example: Doe
        contact:
          description: The contact details for the veterinarian (for backward compatibility). In FHIR, use telecom array.
          allOf:
          - $ref: '#/components/schemas/Contact'
      required:
      - resourceType
      - id

