 # schemas/Report.yaml
    Report:
      title: Report (DiagnosticReport)
      description: |
        The findings and interpretations of diagnostic tests performed on patients, and/or specimens derived from these.
        Aligns with FHIR R4 DiagnosticReport resource for veterinary diagnostics.

        Reports contain an array of results that group clinical observations into test results as requested in an order, or with a meaningful logical grouping.
      type: object
      properties:
        resourceType:
          type: string
          enum: [DiagnosticReport]
          description: FHIR resource type identifier
          example: DiagnosticReport
        id:
          type: string
          format: uuid
          description: |
            The unique identifier of the report. Maps to FHIR DiagnosticReport.id
          readOnly: true
          example: 3025460e-7606-4643-a1ff-47c732e8ab20
        meta:
          type: object
          description: FHIR metadata about the resource
          properties:
            versionId:
              type: string
            lastUpdated:
              type: string
              format: date-time
        basedOn:
          type: array
          description: |
            Reference to the order/ServiceRequest that this report fulfills
          items:
            type: object
            properties:
              reference:
                type: string
                example: ServiceRequest/74c7cac2-0bd5-4e56-b114-f088a502dc6a
        status:
          type: string
          description: |
            The status of the diagnostic report. Aligned with FHIR DiagnosticReportStatus value set.

            FHIR-aligned statuses:
            - `registered` — The existence of the report is registered, but results are not yet available (maps from REGISTERED)
            - `partial` — Some results are available, data may be incomplete (maps from PARTIAL)
            - `preliminary` — Initial findings available, verification not yet final
            - `final` — The report is complete and verified by authorized person (maps from FINAL)
            - `amended` — Subsequent to being final, the report has been modified
            - `corrected` — Subsequent to being final, the report has been modified to correct an error
            - `cancelled` — The report is unavailable (maps from CANCELLED)
            - `entered-in-error` — The report has been withdrawn
          enum:
          - registered
          - partial
          - preliminary
          - final
          - amended
          - corrected
          - appended
          - cancelled
          - entered-in-error
          - unknown
          example: final
        category:
          type: array
          description: |
            Service category. In FHIR, typically uses diagnostic service section codes.
          items:
            type: object
            properties:
              coding:
                type: array
                items:
                  type: object
                  properties:
                    system:
                      type: string
                      example: http://terminology.hl7.org/CodeSystem/v2-0074
                    code:
                      type: string
                      example: LAB
                    display:
                      type: string
                      example: Laboratory
        code:
          type: object
          description: |
            Name/Code for this diagnostic report. Maps to FHIR CodeableConcept. Required in FHIR.
            Identifies the type of diagnostic report (e.g., Hematology, Chemistry, Urinalysis).
          properties:
            coding:
              type: array
              items:
                type: object
                properties:
                  system:
                    type: string
                    example: http://loinc.org
                  code:
                    type: string
                    example: '58410-2'
                  display:
                    type: string
                    example: Complete blood count (hemogram) panel
            text:
              type: string
              example: Complete Blood Count
        subject:
          type: object
          description: |
            The subject of the report. Maps to FHIR Reference to Patient resource.
          properties:
            reference:
              type: string
              example: Patient/74c7cac2-0bd5-4e56-b114-f088a502dc6a
            display:
              type: string
        effectiveDateTime:
          type: string
          format: date-time
          description: |
            Clinically relevant time/time-period for report. When the specimen was collected.
          example: '2020-01-01T00:00:00Z'
        issued:
          type: string
          format: date-time
          description: |
            DateTime this version was made available. Maps to FHIR instant.
          readOnly: true
          example: '2020-01-01T00:00:00Z'
        result:
          type: array
          description: |
            Observations that are part of this diagnostic report.
            In FHIR, these are References to Observation resources.
          items:
            type: object
            properties:
              reference:
                type: string
                example: Observation/abc-123
              display:
                type: string
        presentedForm:
          type: array
          description: |
            Rich text representation of the entire result as issued by the diagnostic service. 

            Multiple formats are allowed but they shall be semantically equivalent.
            Maps to FHIR Attachment datatype.
          items:
            $ref: '#/components/schemas/Attachment'
        orderId:
          type: string
          format: uuid
          description: |
            The unique identifier of the order that generated the report (for backward compatibility).
            In FHIR, use basedOn reference instead.
          readOnly: true
          example: 74c7cac2-0bd5-4e56-b114-f088a502dc6a
        createdAt:
          type: string
          format: date-time
          description: |
            The datetime that the result was created (for backward compatibility).
            In FHIR, use issued.
          readOnly: true
          example: '2020-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: |
            The datetime that the result was updated (for backward compatibility).
          readOnly: true
          example: '2020-01-01T00:00:00Z'
        patient:
          description: |
            The patient (for backward compatibility). In FHIR, use subject reference.
          $ref: '#/components/schemas/Patient'
        testResultsSet:
          type: array
          description: |
            Array of test results as requested in the order (for backward compatibility).
            In FHIR, these map to result references (array of References to Observation).
          items:
            $ref: '#/components/schemas/TestResult'
      required:
      - resourceType
      - id
      - status
      - code

